query AminalsList($first: Int = 100, $address: String = "") {
  aminals(limit: $first, orderBy: "aminalIndex", orderDirection: "asc") {
    items {
      id
      contractAddress
      aminalIndex
      parentOne {
        id
        contractAddress
        aminalIndex
      }
      parentTwo {
        id
        contractAddress
        aminalIndex
      }
      energy
      totalLove
      ethBalance
      blockTimestamp
      tokenURI
      traits
      lovers(where: { userId: $address }, limit: 1) {
        items {
          love
        }
      }
    }
  }
}

query AminalById($contractAddress: String!, $address: String = "") {
  aminal(id: $contractAddress) {
    id
    contractAddress
    aminalIndex
    parentOne {
      id
      contractAddress
      aminalIndex
    }
    parentTwo {
      id
      contractAddress
      aminalIndex
    }
    energy
    totalLove
    ethBalance
    blockTimestamp
    tokenURI
    traits
    lovers(where: { userId: $address }, limit: 1) {
      items {
        love
      }
    }
    feeds(limit: 100, orderBy: "blockTimestamp", orderDirection: "desc") {
      items {
        id
        sender {
          id
          address
        }
        amount
        love
        totalLove
        energy
        blockTimestamp
      }
    }
    skillsUsed(limit: 100, orderBy: "blockTimestamp", orderDirection: "desc") {
      items {
        id
        caller {
          id
          address
        }
        skillAddress
        selector
        newEnergy
        blockTimestamp
      }
    }
  }
}

