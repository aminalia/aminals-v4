query AminalByContractAddress($contractAddress: String!, $address: String = "") {
  aminal(id: $contractAddress) {
    id
    contractAddress
    aminalIndex
    parentOne {
      id
      contractAddress
      aminalIndex
      energy
      totalLove
      tokenURI
    }
    parentTwo {
      id
      contractAddress
      aminalIndex
      energy
      totalLove
      tokenURI
    }
    energy
    totalLove
    ethBalance
    blockTimestamp
    tokenURI
    traits
    lovers(where: { userId: $address }, limit: 1) {
      items {
        love
      }
    }
    feeds(limit: 10, orderBy: "blockTimestamp", orderDirection: "desc") {
