query AminalFactory($factoryId: String!) {
  factory(id: $factoryId) {
    id
    totalAminals
    aminals(limit: 100, orderBy: "aminalIndex", orderDirection: "asc") {
      items {
        id
        contractAddress
        aminalIndex
        energy
        totalLove
        ethBalance
        tokenURI
      }
    }
  }
}
