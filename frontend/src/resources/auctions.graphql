query GeneAuctionsList($first: Int = 100) {
  geneAuctions(limit: $first, orderBy: "auctionId", orderDirection: "desc") {
    items {
      id
      auctionId
      aminalOne {
        id
        contractAddress
        aminalIndex
        tokenURI
        traits
      }
      aminalTwo {
        id
        contractAddress
        aminalIndex
        tokenURI
        traits
      }
      childAminal {
        id
        contractAddress
        aminalIndex
        tokenURI
        energy
        totalLove
        traits
      }
      finished
      totalLove
      blockTimestamp
    }
  }
}

query GeneAuction($id: String!) {
  geneAuction(id: $id) {
    id
    auctionId
    aminalOne {
      id
      contractAddress
      aminalIndex
      tokenURI
      traits
    }
    aminalTwo {
      id
      contractAddress
      aminalIndex
      tokenURI
      traits
    }
    childAminal {
      id
      contractAddress
      aminalIndex
      tokenURI
      energy
      totalLove
      traits
    }
    finished
    totalLove
    blockTimestamp
    proposals(limit: 100) {
      items {
        id
        geneNFT {
          id
          tokenId
          name
          svg
        }
        traitType
        proposer {
          id
          address
        }
        loveVotes
        removeVotes
        removed
        blockTimestamp
      }
    }
    votes(limit: 100, orderBy: "loveAmount", orderDirection: "desc") {
      items {
        id
        proposal {
          id
          geneNFT {
            id
            tokenId
          }
          traitType
        }
        voter {
          id
          address
        }
        isRemoveVote
        loveAmount
        blockTimestamp
      }
    }
  }
}

query GeneProposalsList($first: Int = 100) {
  geneProposals(
    limit: $first
    orderBy: "blockTimestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      auction {
        id
        auctionId
      }
      geneNFT {
        id
        tokenId
        name
        svg
      }
      traitType
      proposer {
        id
        address
      }
      loveVotes
      removeVotes
      removed
      blockTimestamp
    }
  }
}

query GeneVotesList($auctionId: String!, $traitType: Int!) {
  geneVotes(
    where: { auctionId: $auctionId }
    orderBy: "loveAmount"
    orderDirection: "desc"
    limit: 100
  ) {
    items {
      id
      proposal {
        id
        geneNFT {
          id
          tokenId
        }
        traitType
      }
      voter {
        id
        address
      }
      isRemoveVote
      loveAmount
      blockTimestamp
    }
  }
}

query GeneVotesByAuction($auctionId: String!) {
  geneVotes(
    where: { auctionId: $auctionId }
    orderBy: "loveAmount"
    orderDirection: "desc"
    limit: 100
  ) {
    items {
      id
      proposal {
        id
        geneNFT {
          id
          tokenId
          name
          svg
        }
        traitType
      }
      voter {
        id
        address
      }
      isRemoveVote
      loveAmount
      blockTimestamp
    }
  }
}
